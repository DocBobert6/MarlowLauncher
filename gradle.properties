org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
kotlin.code.style=official
# Local builds run with --offline against ~/workspace/.gradle-launcher
# (GRADLE_USER_HOME). Java processes cannot reach the network in this
# sandbox ("other_tcp: Deny"), so dependency downloads fail; the cache
# is a copy of the Automap project's proven Gradle cache. CI builds
# online with the same pinned versions. Do not attempt a bypass
# (renaming java binaries, permission changes) — only Robert can flip
# that setting.
