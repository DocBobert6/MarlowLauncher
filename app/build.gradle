// Marlow Launcher — app module (plugins DSL; AGP 9 style).
//
// Rebuilt 2026-11-26 for GitHub CI. AGP 9.0+ supplies Kotlin support
// itself, so there is no kotlin-android plugin here (run 5 rejected
// it outright). The Compose compiler plugin is separate and still
// applied. Everything else — SDK levels, dependencies, Compose,
// toolchain — is unchanged from the original scaffold.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'app.launcher'
    compileSdk 37

    defaultConfig {
        applicationId 'app.launcher'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0-dev'
    }

    buildTypes {
        debug {}
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    // Run 19 proved the manifest package attribute (run 18's fix)
    // does NOT cure the gate's Resources$NotFoundException: AGP
    // strips package from the merged manifest, so Robolectric never
    // sees it — run 19 checked out the fixed manifest and failed
    // identically. The real cause is that this flag was never set:
    // without includeAndroidResources, Gradle never generates the
    // test_config.properties Robolectric reads to find the app
    // package, the merged manifest, and the resource APK — so the
    // 0x7f table is never built and the first 0x7f read at startup
    // (Material 3's SnackbarHost reading its dismiss string,
    // #0x7f09003a) throws. Runs 6-14 passed only because nothing in
    // the startup composition read a resource. This flag is what
    // makes the gate test the real composition.
    // (Full testLogging below is the run-17 diagnostic: full
    // exception traces go to the console log, where job-logs can
    // read them — the XML report is only written when the task
    // completes, and a hung worker writes nothing.)
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                testLogging {
                    exceptionFormat 'full'
                    showStandardStreams true
                }
            }
        }
    }
}

kotlin {
    jvmToolchain(17)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.01.00')
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    // NOTE (Phase 5, #176): ui-tooling-preview was removed — no
    // @Preview exists anywhere in the app, so it was dead weight.
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3:1.4.0-alpha06'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    testImplementation 'junit:junit:4.13.2'
    // Startup gate (Robolectric) — NOT in the local offline cache, so it
    // runs on CI only until the cache gains Robolectric. See BUILD_LOG.md.
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
