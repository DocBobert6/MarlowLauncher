// Marlow Launcher — root build file (plugins DSL; AGP 9 style).
//
// Rebuilt 2026-11-26 for GitHub CI: the old buildscript-classpath +
// legacy `apply plugin:` scaffold was written for the workspace's
// offline Gradle cache, and AGP 9.4.1 rejected it piece by piece
// (runs 4–5: FAIL_ON_PROJECT_REPOS vs allprojects, then the
// kotlin-android plugin). Plugin versions are declared here with
// `apply false` and resolved through pluginManagement in
// settings.gradle. There is no kotlin-android plugin anywhere —
// AGP 9.0+ has built-in Kotlin support and rejects it.
plugins {
    id 'com.android.application' version '9.4.1' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.20' apply false
}
